<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Contratos em Foco · ContratualizaSUS-MG</title>
<meta name="theme-color" content="#0E3325">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Jogo de auditório: tela do projetor (apresentar) + celulares (jogar). Tema único escuro, identidade ContratualizaSUS-MG. */
:root{
  --bg:#0E3325;--bg2:#123F2E;--bg3:#1B4D3A;--linha:#2F6650;
  --fg:#F5F1EB;--fg2:#CFE3D6;--muted:#9FC2AF;
  --verde:#2E9E4F;--azul:#1F6FC5;--laranja:#E8892B;--laranja2:#C65A12;
  --a:#E2363F;--b:#1F6FC5;--c:#E0A100;--d:#2E9E4F;--ok:#3BC46A;--erro:#E5483B;
  --font:'Figtree','Segoe UI',Arial,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--laranja);outline-offset:3px}
h1,h2,h3,p{margin:0}
.app{height:100%;display:flex;flex-direction:column;gap:1.6vh;padding-block:max(2vh,env(safe-area-inset-top,0px)) max(2vh,env(safe-area-inset-bottom,0px));max-width:1700px;margin:0 auto;position:relative}
.bgshapes{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgshapes i{position:absolute;opacity:.07;animation:flutua 18s linear infinite}
@keyframes flutua{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-30vh) rotate(360deg)}}
.app>*{position:relative;z-index:1}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(16px,2.4vh,26px)}
.marca .logo{width:clamp(34px,5vh,54px);height:auto}
.marca b{color:#7FD39A}
.ctl{display:flex;gap:8px}
.ic{background:var(--bg3);border:1px solid var(--linha);border-radius:12px;padding:.8vh 1.6vh;font-weight:700;font-size:clamp(13px,1.9vh,18px)}
.palco{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2.4vh}
.rodape{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:clamp(12px,1.8vh,18px)}
kbd{background:var(--bg3);border:1px solid var(--linha);border-radius:6px;padding:1px 8px;font-family:var(--font);font-weight:700}
.btn{border:0;border-radius:16px;padding:1.6vh 4vh;font-weight:900;font-size:clamp(18px,3vh,32px);background:var(--fg);color:var(--bg);box-shadow:0 6px 0 #B9B2A6;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B9B2A6}
.btn.lar{background:var(--laranja);color:#2A1404;box-shadow:0 6px 0 var(--laranja2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#7FD39A;font-size:clamp(12px,2vh,20px)}
.aviso-teste{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);background:var(--laranja);color:#2A1404;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;z-index:20;white-space:nowrap}
/* ===== logo ContratualizaSUS-MG folheando (loop) ===== */
.logo{overflow:visible}
.logo.anim .lt{transform-origin:54px 40px;animation:lgT 9s ease-in-out infinite}
.logo.anim .lc{transform-origin:48px 40px;animation:lgC 9s cubic-bezier(.45,.05,.55,.95) infinite}
.logo.anim .lfr{animation:lgFr 9s linear infinite}.logo.anim .lvs{animation:lgVs 9s linear infinite}
.logo.anim .le{transform-origin:74px 33px;animation:lgE 9s cubic-bezier(.3,1.5,.5,1) infinite}
.logo.anim .lx{transform-origin:74px 33px;animation:lgX 9s cubic-bezier(.2,1.9,.4,1) infinite}
.logo.anim .lf{transform-origin:48px 40px;opacity:0;animation:9s cubic-bezier(.45,.05,.55,.95) infinite}
.logo.anim .lf1{animation-name:lgF1}.logo.anim .lf2{animation-name:lgF2}.logo.anim .lf3{animation-name:lgF3}.logo.anim .lf4{animation-name:lgF4}
@keyframes lgT{0%{transform:scale(.55);opacity:0}6%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(.55);opacity:0}}
@keyframes lgC{0%,10%{transform:scaleX(1)}22%,100%{transform:scaleX(-1)}}
@keyframes lgFr{0%,15.9%{opacity:1}16%,100%{opacity:0}}
@keyframes lgVs{0%,15.9%{opacity:0}16%,100%{opacity:1}}
@keyframes lgE{0%,54%{transform:rotate(-200deg) scale(.4);opacity:0}66%,100%{transform:none;opacity:1}}
@keyframes lgX{0%,66%{transform:scale(2.4);opacity:0}70%{opacity:1}73%,100%{transform:none;opacity:1}}
@keyframes lgF1{0%,23%{transform:scaleX(1);opacity:0}24%{opacity:1}31%{transform:scaleX(-1);opacity:1}33%,100%{transform:scaleX(-1);opacity:0}}
@keyframes lgF2{0%,30%{transform:scaleX(1);opacity:0}31%{opacity:1}38%{transform:scaleX(-1);opacity:1}40%,100%{transform:scaleX(-1);opacity:0}}
@keyframes lgF3{0%,37%{transform:scaleX(1);opacity:0}38%{opacity:1}45%{transform:scaleX(-1);opacity:1}47%,100%{transform:scaleX(-1);opacity:0}}
@keyframes lgF4{0%,44%{transform:scaleX(1);opacity:0}45%{opacity:1}52%{transform:scaleX(-1);opacity:1}54%,100%{transform:scaleX(-1);opacity:0}}

.logo .folha{display:none}
.intro .logo .folha,.lobby-h .logo .folha{display:inline}

/* ===== lobby do apresentador ===== */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:3vh;min-height:0;flex:1}
.entrar{background:var(--fg);color:#14261D;border-radius:26px;padding:3vh;display:flex;flex-direction:column;align-items:center;gap:1.6vh;text-align:center}
.entrar .url{font-weight:800;font-size:clamp(16px,2.6vh,28px)}
.entrar .url b{color:var(--laranja2)}
.pin-l{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(13px,2vh,20px);color:#4C5A53}
.pin{font-weight:900;font-size:clamp(54px,12vh,140px);line-height:1;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#qr{background:#fff;padding:12px;border-radius:14px}
#qr img,#qr canvas{display:block;width:clamp(150px,26vh,300px)!important;height:auto!important}
.sala{display:flex;flex-direction:column;gap:2vh;min-height:0}
.sala-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cont-j{display:flex;align-items:center;gap:12px;font-weight:900;font-size:clamp(22px,4vh,44px)}
.cont-j span{font-size:.5em;color:var(--muted);font-weight:700}
.jogadores{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:1.2vh;padding:4px}
.bolha{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--linha);border-radius:999px;padding:.6vh 2vh .6vh .6vh;font-weight:800;font-size:clamp(15px,2.4vh,26px);animation:entra-b .5s cubic-bezier(.2,1.6,.4,1)}
.bolha button{background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;font-weight:800}
@keyframes entra-b{from{transform:scale(0)}}
.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;width:clamp(36px,5.4vh,60px);height:clamp(36px,5.4vh,60px);font-size:clamp(22px,3.4vh,38px);line-height:1}
.vazio{color:var(--muted);font-size:clamp(16px,2.6vh,28px);text-align:center;margin:auto}
.cfg{display:flex;gap:1vh;flex-wrap:wrap;align-items:center}
.rod{background:var(--bg3);border:2px solid var(--linha);border-radius:14px;padding:1vh 1.8vh;font-weight:800;font-size:clamp(14px,2vh,20px)}
.rod[aria-pressed="true"]{border-color:var(--laranja);background:#3A2A12}

/* ===== pergunta (apresentador) ===== */
.intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.6vh}
.intro .logo{width:clamp(140px,26vh,300px);height:auto}
/* na abertura de cada pergunta o livro roda uma vez inteira (abre, folheia, engrenagem e carimbo) e fica parado completo */
.intro .logo.anim *{animation-duration:5.2s!important;animation-iteration-count:1!important;animation-fill-mode:forwards!important}
.intro .logo.anim .lt{animation-name:lgTi!important}
@keyframes lgTi{0%{transform:scale(.55);opacity:0}6%,100%{transform:scale(1);opacity:1}}
.intro .num{font-size:clamp(28px,7vh,80px);font-weight:900;line-height:1;animation:pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.intro .de{font-size:clamp(18px,3vh,32px);color:var(--fg2);font-weight:700}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.qtopo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3vh;align-items:center}
.relogio{--d:clamp(80px,14vh,160px);width:var(--d);height:var(--d);position:relative}
.relogio svg{width:100%;height:100%;transform:rotate(-90deg)}
.relogio circle{fill:none;stroke-width:12}
.relogio .t{stroke:var(--bg3)}.relogio .p{stroke:var(--fg);stroke-linecap:round}
.relogio b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--d)*.4);font-weight:900;font-variant-numeric:tabular-nums}
.relogio.alerta .p{stroke:var(--a)}.relogio.alerta b{color:#FF8A8F}
.enun{background:var(--fg);color:#14261D;border-radius:22px;padding:2.4vh 3.4vh;font-size:clamp(22px,4.4vh,52px);font-weight:800;line-height:1.18;text-align:center;text-wrap:balance;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.respcont{text-align:center;font-weight:900;font-size:clamp(28px,6vh,70px);line-height:1}
.respcont small{display:block;font-size:.3em;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.resps{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh}
.resp{position:relative;border-radius:18px;display:flex;align-items:center;gap:2.4vh;padding:1.8vh 3vh;font-weight:800;font-size:clamp(18px,3.4vh,40px);line-height:1.15;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:opacity .4s,transform .4s,filter .4s;min-height:12vh}
.resp svg.f{flex:none;width:clamp(34px,6vh,68px);height:clamp(34px,6vh,68px)}
.resp .txt{min-width:0;text-wrap:balance;flex:1}
.resp.A{background:var(--a)}.resp.B{background:var(--b)}.resp.C{background:var(--c)}.resp.D{background:var(--d)}
.resp .qtd{flex:none;font-weight:900;font-size:.9em;background:rgba(0,0,0,.22);border-radius:12px;padding:.4vh 1.4vh;font-variant-numeric:tabular-nums}
.revelado .resp.errada{opacity:.25;filter:grayscale(.7);transform:scale(.97)}
.revelado .resp.certa{outline:6px solid #fff;transform:scale(1.02)}
.grafico{display:flex;align-items:flex-end;justify-content:center;gap:3vw;height:20vh}
.barraG{width:min(10vw,140px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.6vh;height:100%}
.barraG i{display:block;width:100%;border-radius:10px 10px 0 0;height:0;transition:height 1s cubic-bezier(.2,1.2,.4,1)}
.barraG b{font-size:clamp(18px,3vh,32px);font-weight:900}
.barraG .ic2{display:flex;align-items:center;gap:6px}
.barraG .ic2 svg{width:clamp(20px,3vh,32px);height:clamp(20px,3vh,32px)}
.barraG.err{opacity:.35}
.explic{background:var(--bg2);border:1px solid var(--linha);border-left:8px solid var(--ok);border-radius:16px;padding:1.6vh 2.4vh;font-size:clamp(15px,2.5vh,28px);line-height:1.35;color:var(--fg2)}
.explic b{color:var(--fg)}
.direita{display:flex;justify-content:flex-end}

/* ===== placar ===== */
.placar h2{font-size:clamp(30px,6vh,70px);font-weight:900;text-align:center}
.lista{position:relative;display:flex;flex-direction:column;gap:1.2vh;width:min(1100px,100%);margin:2vh auto}
.linhaP{display:grid;grid-template-columns:5vh auto minmax(0,1fr) auto;align-items:center;gap:2vh;background:var(--bg2);border:1px solid var(--linha);border-radius:16px;padding:1vh 2.4vh;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.linhaP .pos{font-weight:900;font-size:clamp(18px,3vh,32px);color:var(--muted)}
.linhaP .nome{font-weight:800;font-size:clamp(16px,2.8vh,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linhaP .pts{font-weight:900;font-size:clamp(20px,3.4vh,38px);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:1.2vh}
.linhaP .ganho{font-size:.55em;color:#7FD39A}
.linhaP.lider{background:#24533F;border-color:#7FD39A}

/* ===== pódio ===== */
.podio{display:flex;flex-direction:column;align-items:center;gap:2vh}
.podio h2{font-size:clamp(34px,7vh,84px);font-weight:900}
.degraus{display:flex;align-items:flex-end;justify-content:center;gap:2vw;height:56vh;width:100%}
.degrau{width:min(26vw,320px);display:flex;flex-direction:column;align-items:center;gap:1vh}
.degrau .av{width:clamp(60px,11vh,130px);height:clamp(60px,11vh,130px);font-size:clamp(36px,7vh,80px);opacity:0;animation:cai .6s cubic-bezier(.2,1.6,.4,1) forwards}
.degrau .quemp{font-weight:900;font-size:clamp(16px,3vh,34px);text-align:center;opacity:0;animation:aparece .5s forwards;text-wrap:balance}
.degrau .ptsp{font-weight:800;color:var(--fg2);font-size:clamp(14px,2.2vh,24px);opacity:0;animation:aparece .5s forwards}
.coluna{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:2vh;font-weight:900;font-size:clamp(40px,9vh,110px);color:rgba(0,0,0,.35);height:0;animation:sobe 1s cubic-bezier(.2,1.2,.4,1) forwards}
.d1 .coluna{background:linear-gradient(#F2C14B,#C98F12);--h:30vh;animation-delay:3.4s}.d1 .av,.d1 .quemp,.d1 .ptsp{animation-delay:4.3s}
.d2 .coluna{background:linear-gradient(#D7DEE2,#98A4AB);--h:22vh;animation-delay:1.8s}.d2 .av,.d2 .quemp,.d2 .ptsp{animation-delay:2.7s}
.d3 .coluna{background:linear-gradient(#E39E6C,#B4500F);--h:15vh;animation-delay:.3s}.d3 .av,.d3 .quemp,.d3 .ptsp{animation-delay:1.2s}
@keyframes sobe{to{height:var(--h)}}
@keyframes aparece{to{opacity:1}}
@keyframes cai{from{transform:translateY(-40vh);opacity:0}to{transform:none;opacity:1}}
canvas#confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.acoes{display:flex;gap:2vh;flex-wrap:wrap;justify-content:center}

/* ===== celular ===== */
.cel{width:min(520px,100%);margin:0 auto;display:flex;flex-direction:column;gap:18px;flex:1;min-height:0;justify-content:center}
.cartao{background:var(--fg);color:#14261D;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px}
.cartao h1{font-size:30px;font-weight:900;line-height:1.1}
.cartao label{font-weight:800;font-size:15px;color:#1E6B37}
.cartao input{width:100%;border:2px solid #D8D0C2;border-radius:14px;padding:14px 16px;font-size:22px;font-weight:800;color:#14261D;background:#fff;text-align:center}
.cartao input#pin-in{letter-spacing:.3em;font-variant-numeric:tabular-nums}
.cartao .btn{width:100%}
.erro{color:#B42318;font-weight:700;font-size:15px;min-height:1.2em;text-align:center}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avs button{border:3px solid transparent;border-radius:18px;background:#EDE7DC;aspect-ratio:1;display:grid;place-items:center;font-size:34px;padding:0;transition:transform .15s}
.avs button[aria-pressed="true"]{border-color:var(--laranja);transform:scale(1.08);background:#fff}
.espera{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.espera .av{width:120px;height:120px;font-size:72px;animation:pula 1.6s ease-in-out infinite}
@keyframes pula{50%{transform:translateY(-14px)}}
.espera h2{font-size:30px;font-weight:900}
.espera p{color:var(--fg2);font-size:18px}
.botoes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.botoes button{border:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;color:#fff;font-weight:800;font-size:17px;line-height:1.2;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.botoes button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.botoes svg{width:56px;height:56px}
.botoes .A{background:var(--a)}.botoes .B{background:var(--b)}.botoes .C{background:var(--c)}.botoes .D{background:var(--d)}
.res{flex:1;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.res.ok{background:#1E7A3C}.res.no{background:#A8261E}.res.neutro{background:var(--bg2)}
.res h2{font-size:36px;font-weight:900}
.res .g{font-size:30px;font-weight:900;background:rgba(0,0,0,.2);border-radius:14px;padding:6px 18px}
.res p{font-size:19px;font-weight:700}
.minha{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1px solid var(--linha);border-radius:16px;padding:8px 14px 8px 8px;font-weight:800}
.minha span{display:flex;align-items:center;gap:10px;min-width:0}
.minha span em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:820px){
  body{overflow:auto}
  .lobby{grid-template-columns:minmax(0,1fr)}
  .resps{grid-template-columns:minmax(0,1fr)}
  .qtopo{grid-template-columns:auto minmax(0,1fr)}
  .qtopo .respcont{display:none}
}
@media (prefers-reduced-motion:reduce){.bgshapes i,.bolha,.espera .av{animation:none}}
/* ===== pódio com festa ===== */
.degrau{position:relative;isolation:isolate}
.degrau .coluna{animation-delay:var(--t)!important;overflow:hidden}
.degrau .av,.degrau .quemp,.degrau .ptsp{animation-delay:calc(var(--t) + .9s)!important}
.podio .acoes{opacity:0;animation:aparece .6s forwards;animation-delay:var(--t)}
.podio .suspense{font-size:clamp(26px,5.5vh,64px);font-weight:900;color:#F2C14B;opacity:0;text-align:center;min-height:1.2em;margin:0;transition:opacity .4s;text-shadow:0 0 24px rgba(242,193,75,.6)}
body.suspense .podio .suspense{opacity:1;animation:pulsa .5s ease-in-out infinite alternate}
@keyframes pulsa{to{transform:scale(1.08)}}
.holofote{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .7s;overflow:hidden}
.holofote::before{content:"";position:absolute;left:-50vw;top:-50vh;width:200vw;height:200vh;background:radial-gradient(circle at 50% 62%,rgba(255,240,190,.10) 0 13vh,rgba(0,0,0,.82) 30vh);animation:varre 1.3s ease-in-out infinite alternate}
@keyframes varre{from{transform:translateX(-22vw)}to{transform:translateX(22vw)}}
body.suspense .holofote{opacity:1}
.degrau .ptsp{text-shadow:0 2px 6px rgba(0,0,0,.6)}
.classif{position:fixed;inset:0;z-index:8;background:rgba(8,30,22,.94);display:flex;justify-content:center;overflow:auto;padding:4vh 3vw}
.classif-in{width:min(1500px,100%);display:flex;flex-direction:column;gap:1.4vh}
.classif h2{font-size:clamp(28px,5.5vh,64px);font-weight:900;text-align:center}
.classif .eyebrow{text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1vh 1.4vw;margin-top:1vh}
.cl{display:grid;grid-template-columns:5.2vh auto minmax(0,1fr) auto;align-items:center;gap:1.4vh;background:var(--bg2);border:1px solid var(--linha);border-radius:14px;padding:.8vh 1.8vh;opacity:0;animation:aparece .35s forwards}
.cl .av{width:clamp(30px,5vh,52px);height:clamp(30px,5vh,52px);font-size:clamp(18px,3vh,32px)}
.cl.top{border-color:#F2C14B;background:rgba(242,193,75,.12)}
.cpos{font-weight:900;font-size:clamp(16px,2.8vh,30px);text-align:center}

    $('rodape').innerHTML='<span>A próxima rodada é um jogo novo: o placar começa do zero</span><span></span>'}

  document.addEventListener('keydown',e=>{if(!E)return;const t=e.target&&e.target.tagName;if(t==='INPUT')return;
    if(e.key==='f'||e.key==='F'){cheia();return}
    if(e.code==='Space'||e.key==='ArrowRight'){if(t==='BUTTON'&&e.code==='Space')return;e.preventDefault();ctx();
      if(E.fase==='lobby'&&Object.keys(J).length)novaRodada(rodSel);
      else if(E.fase==='intro'){clearTimeout(intro);setE({fase:'pergunta',t0:NET.ts()})}
      else if(E.fase==='pergunta')revelar();
      else if(E.fase==='revelado')setE({fase:'placar'});
      else if(E.fase==='placar')avancaPlacar()}});

  NET.pronto.then(()=>{if(pin){NET.get('jogos/'+pin+'/estado').then(v=>{if(v)ligar();else novoJogo()})}else novoJogo()})
   .catch(()=>{palco.innerHTML='<p class="vazio">Não foi possível conectar ao servidor do jogo. Verifique a internet e recarregue a página.</p>'});
}

/* =====================================================================
   JOGADOR (celular)
   ===================================================================== */
function jogador(){
  const qs=new URLSearchParams(location.search);let pin=(qs.get('pin')||'').replace(/\D/g,'');
  let eu=null,E=null,J={},desl=[],ultimaTela='',minhaResp=null,somFeito='',avSel=Math.floor(Math.random()*PERSONAGENS.length),tmr=null,tPod=null,festaCel='';
  $('ctl').innerHTML='';$('rodape').innerHTML='';
  function telaPin(msg){palco.innerHTML='<div class="cel"><div class="cartao"><h1>Quiz Contratos em Foco</h1><label for="pin-in">PIN do jogo</label><input id="pin-in" inputmode="numeric" maxlength="7" autocomplete="off" value="'+esc(pin)+'" placeholder="000000"><p class="erro" id="err">'+esc(msg||'')+'</p><button class="btn lar" id="bPin">Entrar</button></div></div>';
    $('bPin').onclick=async()=>{const v=$('pin-in').value.replace(/\D/g,'');if(v.length!==6)return $('err').textContent='O PIN tem 6 números.';
      const est=await NET.get('jogos/'+v+'/estado');if(!est)return $('err').textContent='Não achamos esse jogo. Confira o PIN na tela.';pin=v;telaApelido()};
    $('pin-in').onkeydown=e=>{if(e.key==='Enter')$('bPin').click()}}
  function telaApelido(msg){palco.innerHTML='<div class="cel"><div class="cartao"><h1>Escolha seu personagem</h1><div class="avs" id="avs" role="group" aria-label="Personagens">'+PERSONAGENS.map((p,i)=>'<button type="button" data-i="'+i+'" aria-pressed="'+(i===avSel)+'" aria-label="Personagem '+(i+1)+'" style="background:'+(i===avSel?'#fff':p[1]+'55')+'">'+p[0]+'</button>').join('')+'</div><label for="apelido">Seu apelido</label><input id="apelido" maxlength="15" autocomplete="off" placeholder="Ex.: Maria URS BH"><p class="erro" id="err">'+esc(msg||'')+'</p><button class="btn lar" id="bEntra">Entrar no jogo</button></div></div>';
    $('avs').querySelectorAll('button').forEach(b=>b.onclick=()=>{avSel=+b.dataset.i;$('avs').querySelectorAll('button').forEach((x,i)=>{x.setAttribute('aria-pressed',x===b);x.style.background=x===b?'#fff':PERSONAGENS[i][1]+'55'})});
    $('apelido').focus();$('apelido').onkeydown=e=>{if(e.key==='Enter')$('bEntra').click()};
    $('bEntra').onclick=async()=>{const nome=$('apelido').value.trim().replace(/\s+/g,' ');if(nome.length<2)return $('err').textContent='Escreva um apelido com pelo menos 2 letras.';
      const js=await NET.get('jogos/'+pin+'/jogadores')||{};if(Object.values(js).some(j=>j&&j.nome&&j.nome.toLowerCase()===nome.toLowerCase()))return $('err').textContent='Esse apelido já está no jogo. Escolha outro.';
      const est=await NET.get('jogos/'+pin+'/estado');if(!est)return telaPin('Esse jogo foi encerrado.');
      const id='j'+Math.random().toString(36).slice(2,10);eu={id,nome,av:avSel};ss.set('quiz_eu_'+pin,eu);
      await NET.set('jogos/'+pin+'/jogadores/'+id,{nome,av:avSel,pts:0,entrou:NET.ts()});ctx();sEntra();ligar()}}
  function ligar(){desl.forEach(f=>f());let dentro=false;desl=[
    NET.on('jogos/'+pin+'/estado',v=>{E=v;if(!v){sair('O jogo foi encerrado.');return}desenha()}),
    NET.on('jogos/'+pin+'/jogadores',v=>{J=v||{};if(J[eu.id])dentro=true;else if(dentro){sair('Você saiu do jogo. Entre de novo se quiser.');return}desenha(true)})]}
  function sair(m){desl.forEach(f=>f());desl=[];ss.del('quiz_eu_'+pin);eu=null;ultimaTela='';telaApelido(m)}
  const minhaBarra=()=>{const me=J[eu.id]||{};const pos=ordem(J).indexOf(eu.id)+1;return '<div class="minha"><span>'+avHTML(eu.av)+'<em>'+esc(eu.nome)+'</em></span><b>'+(me.pts||0)+' pts'+(pos?' · '+pos+'º':'')+'</b></div>'};
  function desenha(soDados){if(!E||!eu)return;const chave=E.fase+'|'+E.rod+'|'+E.qi;
    if(soDados&&(E.fase==='pergunta'))return;
    if(chave===ultimaTela&&soDados&&E.fase!=='revelado'&&E.fase!=='placar'&&E.fase!=='podio'&&E.fase!=='lobby')return;
    if(chave!==ultimaTela){minhaResp=E.fase==='pergunta'?minhaResp:null}
    ultimaTela=chave;clearInterval(tmr);
    const P=E.fase!=='lobby'?RODADAS[E.rod].perguntas[E.qi]:null;let h='<div class="cel">';
    if(E.fase==='lobby'){h+='<div class="espera">'+avHTML(eu.av)+'<h2>Você está no jogo!</h2><p>Procure <b>'+esc(eu.nome)+'</b> na tela. O jogo já vai começar.</p></div>'}
    else if(E.fase==='intro'){h+=minhaBarra()+'<div class="espera"><h2>Pergunta '+(E.qi+1)+'</h2><p>Prepare-se! Leia a pergunta na tela.</p>'+avHTML(eu.av)+'</div>'}
    else if(E.fase==='pergunta'){const k=E.rod+'_'+E.qi;
      if(minhaResp!==null){h+=minhaBarra()+'<div class="res neutro">'+FORMAS[minhaResp].replace('class="f"','class="f" style="width:90px;height:90px"')+'<h2>Resposta enviada!</h2><p>Será que acertou? Olhe para a tela.</p></div>'}
      else{h+='<p class="eyebrow" style="text-align:center">Pergunta '+(E.qi+1)+' · <span id="tc">'+TEMPO+'</span>s</p><div class="botoes">'+P.r.map((t,i)=>'<button class="'+LETRAS[i]+'" data-i="'+i+'" aria-label="'+CORES[i]+': '+esc(t)+'">'+FORMAS[i]+'<span>'+esc(t)+'</span></button>').join('')+'</div>'}
      palco.innerHTML=h+'</div>';
      if(minhaResp===null){palco.querySelectorAll('.botoes button').forEach(b=>b.onclick=()=>{const r=+b.dataset.i;minhaResp=r;try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}NET.set('jogos/'+pin+'/resp/'+k+'/'+eu.id,{r,t:NET.ts()});ultimaTela='';desenha()});
        const t0=typeof E.t0==='number'?E.t0:NET.now();tmr=setInterval(()=>{const r=Math.max(0,Math.ceil(TEMPO-(NET.now()-t0)/1000));const el=$('tc');if(el)el.textContent=r;if(r<=0){clearInterval(tmr);palco.innerHTML='<div class="cel">'+minhaBarra()+'<div class="res neutro"><h2>Tempo esgotado</h2><p>Fique de olho na próxima!</p></div></div>'}},250)}
      return}
    else if(E.fase==='revelado'||E.fase==='placar'){const me=J[eu.id]||{},u=me.ult&&me.ult.k===E.rod+'_'+E.qi?me.ult:null;const pos=ordem(J).indexOf(eu.id)+1;
      if(!u){h+=minhaBarra()+'<div class="res neutro"><h2>Calculando…</h2></div>'}
      else if(u.ok){h+=minhaBarra()+'<div class="res ok"><h2>Correto!</h2><span class="g">+'+u.ganho+'</span><p>Você está em '+pos+'º lugar</p></div>'}
      else{h+=minhaBarra()+'<div class="res no"><h2>'+(u.resp<0?'Sem resposta':'Não foi dessa vez')+'</h2><p>A certa era a '+CORES[P.c]+'.</p><p>Você está em '+pos+'º lugar</p></div>'}
      if(u&&somFeito!==u.k&&E.fase==='revelado'){somFeito=u.k;try{navigator.vibrate&&navigator.vibrate(u.ok?[40,60,40]:200)}catch(e){};u.ok?sCerto():sErro()}}
    else if(E.fase==='podio'){const o=ordem(J),pos=o.indexOf(eu.id)+1,me=J[eu.id]||{},A=agendaPodio(Math.min(3,o.length));const med=pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':'';
      const quando=(pos>=1&&pos<=3&&A[pos]!=null?A[pos]:A[1])+1.1,passou=typeof E.tp==='number'?(NET.now()-E.tp)/1000:99;
      if(passou<quando){h+='<div class="res neutro"><span class="tambor">🥁</span><h2>Revelando o pódio…</h2><p>Olhe para a tela!</p></div>';clearTimeout(tPod);tPod=setTimeout(()=>{ultimaTela='';desenha()},(quando-passou)*1000+80)}
      else{h+='<div class="res '+(pos===1?'campeao':pos<=3?'ok':'neutro')+'"><h2>'+(pos===1?'🏆 Você venceu!':(med?med+' ':'')+pos+'º lugar')+'</h2><span class="g">'+(me.pts||0)+' pontos</span><p>'+(pos===1?'Primeiro lugar no pódio!':pos<=3?'Você está no pódio!':'Obrigado por jogar!')+'</p>'+avHTML(eu.av)+'</div>';
        const k='p'+E.rod+'|'+(E.tp||0);if(festaCel!==k){festaCel=k;if(pos===1){FX.chuva(7000);FX.brilho(9000);fanfarra();try{navigator.vibrate&&navigator.vibrate([120,60,120,60,400])}catch(e){}}else if(pos<=3){FX.chuva(3500);sDegrau()}}}}
    palco.innerHTML=h+'</div>'}
  NET.pronto.then(async()=>{const salvo=pin&&ss.get('quiz_eu_'+pin);
    if(salvo){const j=await NET.get('jogos/'+pin+'/jogadores/'+salvo.id);if(j){eu=salvo;ligar();return}}
    if(pin){const est=await NET.get('jogos/'+pin+'/estado');if(est)return telaApelido();}
    telaPin()}).catch(()=>{palco.innerHTML='<div class="cel"><div class="cartao"><p class="erro">Sem conexão com o jogo. Verifique a internet e recarregue.</p></div></div>'});
}

/* ===================== início ===================== */
if(new URLSearchParams(location.search).has('apresentar'))apresentador();else jogador();
</script>
